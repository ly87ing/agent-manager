[package]
name = "agent-manager-engine"
version = "0.1.0"
edition = "2021"
default-run = "agent-manager-engine"
description = "Shared Rust engine library and CLI for Agent Manager"
license = "MIT"
repository = "https://github.com/ly87ing/agent-manager"

# Self-spawning fixtures exercise real executable resolution without external runtimes.
[[test]]
name = "native_program_lifecycle"
path = "tests/native_program_lifecycle.rs"
harness = false

[[test]]
name = "native_mcp_protocol"
path = "tests/native_mcp_protocol.rs"
harness = false

[[test]]
name = "native_uv_lifecycle"
path = "tests/native_uv_lifecycle.rs"
harness = false

[lib]
name = "agent_manager_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "raw_value"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
anyhow = "1"
fs2 = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
regex = "1"
semver = "1"
pep440_rs = "=0.7.3"
sha2 = "0.10"
# Scope destructive local-data operations to held directory capabilities.
cap-std = "=4.0.3"
# Read legacy Git index checksums; skill identities remain SHA-256.
sha1 = "0.10"
toml = "0.8"
# Codex config.toml 的 MCP 条目原位编辑（保留注释、未建模字段与其他表）。
# 取 0.20：app/src-tauri 的依赖树把 toml_datetime 钉在 0.6.3，0.22 需要 0.6.11 解不出来。
toml_edit = "0.20"
serde_norway = "0.9"
# Windows 上 canonicalize 不带 `\\?\` 前缀（能安全去掉时），与普通路径可比较；Unix 上同标准库。
dunce = "1"

[target.'cfg(unix)'.dependencies]
# Account-lock ownership/no-follow opens, and macOS read-only mount metadata.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Keep confirmed D-Bus setters in the process that owns Polkit authorization.
zbus = "=5.19.0"
async-io = "2.6"
blocking = "1.6"
futures-lite = "2.6"
zbus_xml = "=5.2.1"

[target.'cfg(windows)'.dependencies]
# Windows 普通用户建不了符号链接时，目录链接改用联接（junction）。
junction = "1"
# 只读注册表里的系统与用户 PATH，判断命令在不在 PATH 上；不写注册表。
winreg = "0.55"
# Hide desktop child consoles and terminate timeout trees with Windows job objects.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell"] }
