[package]
name = "agent-manager-engine"
version = "0.1.0"
edition = "2021"
description = "Shared Rust engine library and CLI for Agent Manager"
license = "MIT"
repository = "https://github.com/ly87ing/agent-manager"

[lib]
name = "agent_manager_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
anyhow = "1"
fs2 = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
regex = "1"
sha2 = "0.10"
toml = "0.8"
# Codex config.toml 的 MCP 条目原位编辑（保留注释、未建模字段与其他表）。
# 取 0.20：app/src-tauri 的依赖树把 toml_datetime 钉在 0.6.3，0.22 需要 0.6.11 解不出来。
toml_edit = "0.20"
serde_norway = "0.9"
