[package]
name = "agent-manager-engine"
version = "0.1.0"
edition = "2021"
description = "Agent Manager native Rust engine (contract v1)"

[lib]
name = "agent_manager_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
anyhow = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
regex = "1"
