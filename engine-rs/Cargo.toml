[package]
name = "agent-manager-engine"
version = "0.1.0"
edition = "2021"
description = "Shared Rust engine library and CLI for Agent Manager"
license = "MIT"
repository = "https://github.com/ly87ing/agent-manager"

[lib]
name = "agent_manager_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
anyhow = "1"
fs2 = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
regex = "1"
sha2 = "0.10"
toml = "0.8"
