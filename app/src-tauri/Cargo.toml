[package]
name = "agent-manager-app"
version = "0.1.0"
description = "Tauri backend for Agent Manager"
license = "MIT"
repository = "https://github.com/ly87ing/agent-manager"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-manager-engine = { path = "../../engine-rs" }
tauri = { version = "2", features = [] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
plist = "1.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18.5"

[patch.crates-io]
glib = { path = "vendor/glib" }

[profile.dev]
incremental = true

# The upstream string-iterator defect appears when the dependency is optimized.
[profile.test.package.glib]
opt-level = 3
