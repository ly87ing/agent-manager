[package]
name = "agent-manager-app"
version = "0.1.0"
description = "Agent Manager desktop client (Engine Contract v1)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-manager-engine = { path = "../../engine-rs" }
tauri = { version = "2", features = [] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true
