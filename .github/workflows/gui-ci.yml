name: GUI CI

on:
  push:
    branches:
      - main
      - rust
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-rs:
    name: "${{ matrix.os }} / engine-rs (cargo)"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache rustup and cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/registry
            ~/.cargo/git
            engine-rs/target
          key: ${{ runner.os }}-engine-cargo-${{ hashFiles('engine-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-engine-cargo-

      - name: Prepare private Windows test directory
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: ./scripts/prepare-windows-test-temp.ps1

      - name: Run cargo tests
        run: cargo test --manifest-path engine-rs/Cargo.toml

      - name: Verify disposable Linux user-manager environment
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          test "$(id -u)" -ne 0
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user start dbus.socket
          AM_ISOLATED_LINUX_USER_MANAGER=1 node scripts/verify-linux-user-environment.mjs
          AM_ISOLATED_LINUX_TIMEZONE=1 node scripts/verify-linux-timezone.mjs

      - name: Run cargo checks
        shell: bash
        run: |
          cargo fmt --manifest-path engine-rs/Cargo.toml -- --check
          cargo check --manifest-path engine-rs/Cargo.toml --all-targets

      - name: Configure rust path remapping
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            REMAP_HOME="$(cygpath -w "$HOME")"
            REMAP_WORKSPACE="$(cygpath -w "$GITHUB_WORKSPACE")"
          else
            REMAP_HOME="$HOME"
            REMAP_WORKSPACE="$GITHUB_WORKSPACE"
          fi
          echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=$REMAP_HOME=/YOUR_BUILD_HOME --remap-path-prefix=$REMAP_WORKSPACE=/YOUR_SOURCE_ROOT" >> "$GITHUB_ENV"

      - name: Build engine release binary
        run: cargo build --release --manifest-path engine-rs/Cargo.toml

  app:
    name: "${{ matrix.target }} / installer"
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tauri 2 Linux system dependencies per official docs
      # (https://v2.tauri.app/start/prerequisites/#linux)
      - name: Install Tauri system dependencies (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils xvfb dbus-x11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        working-directory: app
        run: echo "store_path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache rustup and cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ matrix.target }}-app-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-app-cargo-

      - name: Typecheck
        working-directory: app
        run: pnpm typecheck

      - name: Prepare private Windows test directory
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: ./scripts/prepare-windows-test-temp.ps1

      - name: Run unit tests
        working-directory: app
        run: pnpm test:unit run --maxWorkers=2

      - name: Run Tauri tests and checks
        shell: bash
        run: |
          cargo fmt --manifest-path app/src-tauri/Cargo.toml -- --check
          cargo test --manifest-path app/src-tauri/Cargo.toml
          cargo check --manifest-path app/src-tauri/Cargo.toml --all-targets

      - name: Configure build identity and path remapping
        shell: bash
        run: |
          build_home="$HOME"
          source_root="$GITHUB_WORKSPACE"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            build_home="$(cygpath -w "$HOME")"
            source_root="$(cygpath -w "$GITHUB_WORKSPACE")"
          fi
          echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=$build_home=/YOUR_BUILD_HOME --remap-path-prefix=$source_root=/YOUR_SOURCE_ROOT" >> "$GITHUB_ENV"
          echo "AGENT_MANAGER_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "AGENT_MANAGER_BUILD_DATE=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
          fi

      # 普通 CI 制品不调用签名或 Release；正式发布仍由 GUI Release 门禁处理。
      - name: Build app installers
        working-directory: app
        run: pnpm tauri build --verbose --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect installers and checksums
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_BUNDLES: ${{ matrix.bundles }}
        run: node scripts/collect-installers.mjs

      - name: Verify macOS installer on native architecture
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          installers=("$RUNNER_TEMP/agent-manager-installers/"*.dmg)
          [[ "${#installers[@]}" == 1 ]]
          bash scripts/verify-macos-dmg.sh "${installers[0]}" "$GITHUB_SHA"

      - name: Verify Linux packages in isolated desktop
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          test_root="$(mktemp -d "$RUNNER_TEMP/linux-installer.XXXXXX")"
          trap 'rm -rf "$test_root"' EXIT
          installers="$RUNNER_TEMP/agent-manager-installers"
          images=("$installers/"*.AppImage)
          debs=("$installers/"*.deb)
          [[ "${#images[@]}" == 1 && "${#debs[@]}" == 1 ]]
          chmod +x "${images[0]}"
          (cd "$test_root" && "${images[0]}" --appimage-extract >/dev/null)
          dpkg-deb --extract "${debs[0]}" "$test_root/deb"
          for executable in "$test_root/squashfs-root/AppRun" "$test_root/deb/usr/bin/agent-manager-app"; do
            [[ -x "$executable" ]]
            runtime="$(mktemp -d "$test_root/runtime.XXXXXX")"
            mkdir -p "$runtime/home" "$runtime/data" "$runtime/xdg"
            chmod 700 "$runtime/xdg"
            # 不依赖 FUSE；分别启动从 AppImage 与 deb 解包的真实程序。
            env -i HOME="$runtime/home" AGENT_MANAGER_DATA_DIR="$runtime/data" \
              XDG_RUNTIME_DIR="$runtime/xdg" PATH=/usr/bin:/bin \
              xvfb-run -a dbus-run-session -- bash -c '
                cd /
                "$1" >"$2" 2>&1 &
                app_pid=$!
                trap "kill -TERM $app_pid 2>/dev/null || true; wait $app_pid 2>/dev/null || true" EXIT
                for i in {1..5}; do
                  sleep 1
                  kill -0 "$app_pid" || { cat "$2"; exit 1; }
                done
              ' bash "$executable" "$runtime/app.log"
            echo "isolated startup passed: $(basename "$executable")"
          done

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: agent-manager-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/agent-manager-installers/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
