name: GUI CI

on:
  push:
    branches:
      - main
      - rust
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-rs:
    name: "${{ matrix.os }} / engine-rs (cargo)"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache rustup and cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/registry
            ~/.cargo/git
            engine-rs/target
          key: ${{ runner.os }}-engine-cargo-${{ hashFiles('engine-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-engine-cargo-

      - name: Run cargo tests
        run: cargo test --manifest-path engine-rs/Cargo.toml

      - name: Run cargo checks
        run: |
          cargo fmt --manifest-path engine-rs/Cargo.toml -- --check
          cargo check --manifest-path engine-rs/Cargo.toml --all-targets

      - name: Configure rust path remapping
        shell: bash
        run: |
          echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=$HOME=/YOUR_BUILD_HOME --remap-path-prefix=$GITHUB_WORKSPACE=/YOUR_SOURCE_ROOT" >> "$GITHUB_ENV"

      - name: Build engine release binary
        run: cargo build --release --manifest-path engine-rs/Cargo.toml

  app:
    name: "${{ matrix.os }} / app (typecheck + vitest + tauri build)"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tauri 2 Linux system dependencies per official docs
      # (https://v2.tauri.app/start/prerequisites/#linux)
      - name: Install Tauri system dependencies (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        working-directory: app
        run: echo "store_path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache rustup and cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-app-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-app-cargo-

      - name: Typecheck
        working-directory: app
        run: pnpm typecheck

      - name: Run unit tests
        working-directory: app
        run: pnpm test:unit run

      - name: Run Tauri tests and checks
        run: |
          cargo test --manifest-path app/src-tauri/Cargo.toml
          cargo check --manifest-path app/src-tauri/Cargo.toml --all-targets

      - name: Configure rust path remapping
        shell: bash
        run: |
          echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=$HOME=/YOUR_BUILD_HOME --remap-path-prefix=$GITHUB_WORKSPACE=/YOUR_SOURCE_ROOT" >> "$GITHUB_ENV"

      # bundle target 按平台选择："app" 仅 macOS 存在；Linux 用 deb、Windows 用 nsis。
      - name: Build app bundle
        working-directory: app
        run: |
          case "${{ runner.os }}" in
            macOS) pnpm tauri build --bundles app ;;
            Linux) pnpm tauri build --bundles deb ;;
            *) echo "unsupported runner os: ${{ runner.os }}"; exit 1 ;;
          esac

  app-windows:
    name: windows-latest / app (experimental)
    runs-on: windows-latest
    # 实验性：按 goal 任务书（docs/goal-rust-gui.md Phase 3）允许据实报告，
    # Windows 本机未实测，此 job 失败不阻塞整体 CI。
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        working-directory: app
        run: echo "store_path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache rustup and cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-app-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-app-cargo-

      - name: Typecheck
        working-directory: app
        run: pnpm typecheck

      - name: Run unit tests
        working-directory: app
        run: pnpm test:unit run

      # Windows 独立运行链尚未验收；仅保留静态检查与单测，不产出或宣称安装器。
