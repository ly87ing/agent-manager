name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: "${{ matrix.os }} / Rust + pnpm"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libglib2.0-bin gsettings-desktop-schemas dconf-cli dconf-gsettings-backend

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Verify release and secrets scripts
        run: node --test scripts/*.test.mjs

      - name: Run engine and Tauri checks
        run: |
          cargo fmt --manifest-path engine-rs/Cargo.toml -- --check
          cargo test --manifest-path engine-rs/Cargo.toml
          cargo check --manifest-path engine-rs/Cargo.toml --all-targets
          cargo test --manifest-path app/src-tauri/Cargo.toml
          cargo check --manifest-path app/src-tauri/Cargo.toml --all-targets

      - name: Run frontend checks
        working-directory: app
        run: |
          pnpm typecheck
          pnpm test:unit run
          pnpm build
